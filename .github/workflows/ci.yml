name: CI

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TUIST_SERVER_FULL_HANDLE: mtm-capital/hermes-client
  PREVIEW_URL: https://tuist.dev/mtm-capital/hermes-client/previews/01a1fa37-d407-7d46-8b89-2d79845b8c73

jobs:
  probe:
    name: macOS preview probe
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true
      - name: Host
        run: |
          sw_vers; uname -m; xcodebuild -version
          spctl --status || true
      - name: Authenticate with Tuist
        run: tuist auth login
      - name: Probe
        timeout-minutes: 15
        continue-on-error: true
        run: |
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          inspect() {
            APP="$1"
            echo "== Info.plist"; plutil -p "$APP/Contents/Info.plist" | grep -E "LSMinimumSystemVersion|CFBundleIdentifier|CFBundleExecutable|CFBundleShortVersion|CFBundleVersion"
            echo "== lipo"; lipo -info "$APP/Contents/MacOS/Hermes"
            echo "== codesign -dvvv"; codesign -dvvv "$APP" 2>&1
            echo "== designated requirement"; codesign -d -r- "$APP" 2>&1
            echo "== entitlements"; codesign -d --entitlements - "$APP" 2>&1
            echo "== verify"; codesign --verify --deep --strict -vvvv "$APP" 2>&1 || echo "[PROBE] codesign verify FAILED"
            echo "== spctl"; spctl -a -vvv -t exec "$APP" 2>&1 || echo "[PROBE] spctl rejected"
            echo "== xattr"; xattr -lr "$APP" | head -10
          }
          runpreview() {
            NAME="$1"; URL="$2"
            echo "################ $NAME $URL"
            tuist run "$URL" 2>&1 | tail -5
            sleep 10
            LINE=$(pgrep -fl "Hermes.app/Contents/MacOS/Hermes" | head -1)
            echo "[PROBE] $NAME process: ${LINE:-NOT RUNNING}"
            screencapture -x "$OUT/$NAME.png" || true
            if [ -n "$LINE" ]; then
              BIN=$(echo "$LINE" | cut -d' ' -f2-)
              APP="${BIN%/Contents/MacOS/Hermes}"
              echo "[PROBE] $NAME app: $APP"
              inspect "$APP"
              echo "$APP" > "$RUNNER_TEMP/$NAME-path"
            fi
            pkill -f "Hermes.app/Contents/MacOS/Hermes" || true
            sleep 2
          }
          runpreview A-older https://tuist.dev/mtm-capital/hermes-client/previews/01a1fa1f-c94b-743e-a65f-1dd9d1a703ad
          echo "== container after A"; ls -la ~/Library/Containers/ | grep -i hermes || echo "[PROBE] no container"
          plutil -p ~/Library/Containers/dev.mtmcapital.hermes/.com.apple.containermanagerd.metadata.plist 2>/dev/null | head -40 || true
          runpreview B-newer https://tuist.dev/mtm-capital/hermes-client/previews/01a1fa37-d407-7d46-8b89-2d79845b8c73
          echo "== relaunch A after B"
          A=$(cat "$RUNNER_TEMP/A-older-path" 2>/dev/null)
          if [ -n "$A" ]; then open -n "$A"; sleep 10; pgrep -fl "Hermes.app/Contents/MacOS/Hermes" || echo "[PROBE] A relaunch NOT running"; screencapture -x "$OUT/A-again.png" || true; pkill -f "Hermes.app/Contents/MacOS/Hermes" || true; fi
          echo "== quarantine test on B"
          B=$(cat "$RUNNER_TEMP/B-newer-path" 2>/dev/null)
          if [ -n "$B" ]; then
            cp -R "$B" "$RUNNER_TEMP/QHermes.app"
            xattr -w com.apple.quarantine "0083;$(printf %x $(date +%s));Safari;" "$RUNNER_TEMP/QHermes.app"
            spctl -a -vvv -t exec "$RUNNER_TEMP/QHermes.app" 2>&1 || echo "[PROBE] spctl rejected quarantined copy"
            open -n "$RUNNER_TEMP/QHermes.app" 2>&1 || echo "[PROBE] open failed"
            sleep 8
            pgrep -fl QHermes.app || echo "[PROBE] quarantined copy NOT running"
            screencapture -x "$OUT/quarantine.png" || true
            pkill -f QHermes.app || true
          fi
          echo "== crash reports"
          for f in ~/Library/Logs/DiagnosticReports/*Hermes*; do [ -f "$f" ] && echo "--- $f" && head -c 4000 "$f" && cp "$f" "$OUT/"; done
          echo "== unified log"
          log show --last 5m --style compact --predicate '(process == "Hermes") OR ((process == "containermanagerd" OR process == "syspolicyd" OR process == "amfid" OR process == "kernel" OR process == "sandboxd" OR process == "runningboardd" OR process == "tccd") AND eventMessage CONTAINS[c] "hermes")' 2>/dev/null | grep -v -E " (Df|I|Db) " | tail -120 || true
          log show --last 5m --style compact --predicate 'process == "containermanagerd" AND eventMessage CONTAINS[c] "hermes"' 2>/dev/null | tail -60 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: ${{ runner.temp }}/out
