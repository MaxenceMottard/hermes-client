name: Preview

# Builds the iOS app and shares it as a Tuist Preview when the `preview`
# label is added to an open pull request. The preview always contains a
# simulator build, plus a signed device build when the signing secrets exist.
on:
  pull_request:
    types: [labeled]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # Tuist OIDC authentication

env:
  # Tuist server project, read by Tuist.swift. Update if the Tuist project
  # uses a different handle.
  TUIST_SERVER_FULL_HANDLE: mtm-capital/hermes-client

jobs:
  preview:
    name: Tuist Preview
    if: github.event.label.name == 'preview' && github.event.pull_request.state == 'open'
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      # Device signing (optional, the device build is skipped without them):
      # - BUILD_CERTIFICATE_BASE64: Apple Development certificate + private key (.p12), base64
      # - P12_PASSWORD: password of the .p12
      # - APP_STORE_CONNECT_API_KEY_BASE64: App Store Connect API key (.p8), base64
      # - APP_STORE_CONNECT_KEY_ID / APP_STORE_CONNECT_ISSUER_ID: API key identifiers
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true
      - name: Authenticate with Tuist
        run: tuist auth login
      - name: Generate Tuist project
        run: |
          tuist install
          tuist generate --no-open
      - name: Build for the iOS Simulator
        run: |
          tuist xcodebuild build \
            -workspace Hermes.xcworkspace \
            -scheme Hermes \
            -configuration Debug \
            -sdk iphonesimulator

      - name: Install signing certificate and API key
        id: signing
        if: env.BUILD_CERTIFICATE_BASE64 != '' && env.APP_STORE_CONNECT_API_KEY_BASE64 != ''
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode -o "$API_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm "$CERT_PATH"

          echo "keychain-path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"
          echo "api-key-path=$API_KEY_PATH" >> "$GITHUB_OUTPUT"

      # Automatic signing: Xcode fetches (or creates) the development
      # provisioning profile through the App Store Connect API key. Only devices
      # registered in the Apple Developer account can install this build.
      - name: Build for iOS devices
        if: steps.signing.outcome == 'success'
        run: |
          tuist xcodebuild build \
            -workspace Hermes.xcworkspace \
            -scheme Hermes \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.signing.outputs.api-key-path }}" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      # Shares every iOS build found in derived data (simulator, and device when built).
      - name: Share preview
        run: tuist share Hermes --configuration Debug --platforms ios

      - name: Clean up signing
        if: always() && steps.signing.outcome == 'success'
        run: |
          security delete-keychain "${{ steps.signing.outputs.keychain-path }}" || true
          rm -f "${{ steps.signing.outputs.api-key-path }}"
