# Outils du projet, gérés par mise (https://mise.jdx.dev).
# Installation : `mise install` à la racine du repo.

[tools]
tuist = "4.216.7"

[tasks.generate]
description = "Génère le projet Xcode avec Tuist"
run = "tuist install && tuist generate --no-open"

[tasks.test]
description = "Lance les tests du package HermesKit"
run = "scripts/test.sh"

[tasks.lint]
description = "Vérifie le format Swift"
run = "scripts/lint.sh"

[tasks.build]
description = "Build l'app iOS (destination générique simulateur)"
depends = ["generate"]
run = "xcodebuild -workspace Hermes.xcworkspace -scheme Hermes -destination 'generic/platform=iOS Simulator' build"

[tasks.test-app]
description = "Lance les tests de l'app sur simulateur (destination surchargeable via IOS_DESTINATION)"
depends = ["generate"]
run = "xcodebuild -workspace Hermes.xcworkspace -scheme Hermes -destination \"${IOS_DESTINATION:-platform=iOS Simulator,name=iPhone 17}\" test"
