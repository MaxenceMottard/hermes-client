name: Preview

# Builds the app and shares it as Tuist Previews when the `preview` label
# is added to an open pull request:
# - an iOS simulator build (always),
# - an ad hoc signed macOS build (always). No certificate is needed, but
#   macOS asks again for Keychain access after each new build,
# - an ad hoc signed IPA, installable on the devices registered in the Apple
#   Developer account (only when the App Store Connect API key secrets exist).
# The label is removed as soon as the run starts: add it again to rebuild.
on:
  pull_request:
    types: [labeled]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # Tuist OIDC authentication
  pull-requests: write # Remove the preview label

env:
  # Tuist server project, read by Tuist.swift. Update if the Tuist project
  # uses a different handle.
  TUIST_SERVER_FULL_HANDLE: mtm-capital/hermes-client

jobs:
  preview:
    name: Tuist Preview
    if: github.event.label.name == 'preview' && github.event.pull_request.state == 'open'
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      # App Store Connect API key with the Admin role, so that Xcode can sign
      # with a cloud-managed Apple Distribution certificate and create the
      # ad hoc provisioning profile. The device build is skipped without it.
      # - APP_STORE_CONNECT_API_KEY_BASE64: the .p8 key, base64-encoded
      # - APP_STORE_CONNECT_KEY_ID / APP_STORE_CONNECT_ISSUER_ID: key identifiers
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      # Unique build number (CFBundleVersion) per run and attempt. Tuist rejects
      # a build whose binary ID and build version were already uploaded, and the
      # Debug executable is a stub (code lives in Hermes.debug.dylib) whose ID
      # rarely changes between commits.
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      # First step, so that adding the label again triggers a new preview.
      - name: Remove the preview label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --remove-label preview
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true
      - name: Authenticate with Tuist
        run: tuist auth login
      - name: Generate Tuist project
        run: |
          tuist install
          tuist generate --no-open

      - name: Build for the iOS Simulator
        run: |
          tuist xcodebuild build \
            -workspace Hermes.xcworkspace \
            -scheme Hermes \
            -configuration Debug \
            -sdk iphonesimulator \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
      - name: Share simulator preview
        run: tuist share Hermes --configuration Debug --platforms ios

      - name: Build for macOS
        run: |
          tuist xcodebuild build \
            -workspace Hermes.xcworkspace \
            -scheme Hermes \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
      - name: Share macOS preview
        run: tuist share Hermes --configuration Debug --platforms macos

      - name: Install App Store Connect API key
        id: api-key
        if: env.APP_STORE_CONNECT_API_KEY_BASE64 != ''
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode -o "$API_KEY_PATH"
          echo "path=$API_KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: Archive for iOS devices
        if: steps.api-key.outcome == 'success'
        run: |
          xcodebuild archive \
            -workspace Hermes.xcworkspace \
            -scheme Hermes \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Hermes.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.api-key.outputs.path }}" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export ad hoc IPA
        if: steps.api-key.outcome == 'success'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>release-testing</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>S4J5D3N22R</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Hermes.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.api-key.outputs.path }}" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Share device preview
        if: steps.api-key.outcome == 'success'
        run: tuist share "$RUNNER_TEMP/export/Hermes.ipa"

      - name: Remove App Store Connect API key
        if: always() && steps.api-key.outcome == 'success'
        run: rm -f "${{ steps.api-key.outputs.path }}"
